<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Fundatec - Concursos</title>
    <style>
        :root {
            --primary: #1e3a8a;     
            --secondary: #3b82f6;   
            --success: #16a34a;     
            --error: #dc2626;       
            --bg: #f1f5f9;          
            --surface: #ffffff;     
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        #game-container {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* --- Telas do Sistema --- */
        #disciplina-screen, #assunto-screen, #quiz-screen, #end-screen {
            display: none;
        }
        
        #disciplina-screen { display: block; }

        .screen-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .screen-header h2 { color: var(--primary); margin-bottom: 8px; }
        .screen-header p { color: var(--text-muted); }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            background-color: var(--surface);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        /* --- Estilos do Quiz --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-voltar {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-voltar:hover { color: var(--primary); }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .subject-tag {
            background-color: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn span.letter {
            font-weight: bold;
            margin-right: 12px;
            color: var(--primary);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #eff6ff;
        }

        .option-btn.correct { background-color: var(--success); border-color: var(--success); color: white; }
        .option-btn.correct span.letter { color: white; }
        .option-btn.wrong { background-color: var(--error); border-color: var(--error); color: white; }
        .option-btn.wrong span.letter { color: white; }
        .option-btn:disabled { cursor: default; }

        #feedback-container {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .btn-primary {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover { background-color: #152c6b; }
        #next-btn { display: none; }

        /* --- Tela Final --- */
        #end-screen { text-align: center; }
        #end-screen h2 { margin-bottom: 16px; color: var(--primary); }
        #end-screen p { margin-bottom: 24px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Tela 1: Escolha de Disciplina -->
        <div id="disciplina-screen">
            <div class="screen-header">
                <h2>Simulado Fundatec</h2>
                <p>Escolha a disciplina que deseja estudar:</p>
            </div>
            <div class="menu-options" id="lista-disciplinas">
                <!-- Gerado via JS -->
            </div>
        </div>

        <!-- Tela 2: Escolha de Assunto -->
        <div id="assunto-screen">
            <div class="top-bar">
                <button class="btn-voltar" onclick="mostrarDisciplinas()">← Voltar às Disciplinas</button>
            </div>
            <div class="screen-header">
                <h2 id="titulo-disciplina-escolhida">Disciplina</h2>
                <p>Escolha o tópico do edital:</p>
            </div>
            <div class="menu-options" id="lista-assuntos">
                <!-- Gerado via JS -->
            </div>
        </div>

        <!-- Tela 3: Quiz -->
        <div id="quiz-screen">
            <div class="top-bar">
                <button class="btn-voltar" onclick="mostrarAssuntosDaDisciplinaAtual()">← Trocar Assunto</button>
            </div>
            <header>
                <div class="subject-tag" id="subject">Assunto</div>
                <div class="score-board">Acertos: <span id="score">0</span>/<span id="total-questions">0</span></div>
            </header>

            <div class="question-text" id="question">Carregando questão...</div>
            <div class="options-grid" id="options"></div>
            <div id="feedback-container"></div>
            
            <button id="next-btn" class="btn-primary" onclick="proximaQuestao()">Próxima Questão ➔</button>
        </div>

        <!-- Tela 4: Final -->
        <div id="end-screen">
            <h2>Fim das Questões!</h2>
            <p>Você acertou <strong id="final-score">0</strong> de <strong id="final-total">0</strong> questões deste tópico.</p>
            <button class="btn-primary" onclick="mostrarDisciplinas()">Voltar ao Menu Principal</button>
        </div>
    </div>

            },
            {
                disciplina: "Direito",
                assunto: "Direito Penal: Penas Privativas de Liberdade",
                enunciado: "(Simulado PPRS) A respeito das penas privativas de liberdade no Código Penal, assinale a correta:",
                alternativas: [
                    "A reclusão só pode ser fechada.",
                    "O condenado não reincidente, com pena superior a 4 e até 8 anos, poderá iniciar no regime semiaberto.",
                    "A detenção só admite regime fechado.",
                    "O regime aberto ocorre em colônia agrícola."
                ],
                correta: 1,
                explicacao: "Correto! Cópia literal do Art. 33, § 2º, 'b' do Código Penal."
            },
            {
                disciplina: "Direito",
                assunto: "Direito Constitucional: Fundamentos",
                enunciado: "(Simulado PPRS) Assinale a alternativa que NÃO apresenta um fundamento da República Federativa do Brasil:",
                alternativas: ["Soberania.", "Concessão de asilo político.", "Dignidade da pessoa humana.", "Pluralismo político."],
                correta: 1,
                explicacao: "Correto! A concessão de asilo político é princípio das relações internacionais (Art. 4º)."
            },
            {
                disciplina: "Língua Portuguesa",
                assunto: "Ortografia",
                enunciado: "(Simulado PPRS) Qual das palavras abaixo é escrita corretamente com 'z'?",
                alternativas: ["Bele__a.", "Pe__ado.", "Coi__a.", "Ga__olina."],
                correta: 0,
                explicacao: "Correto! 'Beleza' deriva de adjetivo + sufixo '-eza' (escrito com Z). As demais usam 'S'."
            }
        ];

        // Variáveis Globais de Estado
        let disciplinaAtual = '';
        let assuntoAtual = '';
        let questoesFiltradas = [];
        let questaoAtual = 0;
        let pontuacao = 0;
        const letras = ['A', 'B', 'C', 'D', 'E'];

        // Telas
        const elDisciplinaScreen = document.getElementById('disciplina-screen');
        const elAssuntoScreen = document.getElementById('assunto-screen');
        const elQuizScreen = document.getElementById('quiz-screen');
        const elEndScreen = document.getElementById('end-screen');

        // Inicialização: Gerar botões de Disciplinas dinamicamente
        function carregarDisciplinas() {
            const disciplinasUnicas = [...new Set(bancoDeQuestoes.map(q => q.disciplina))];
            const divLista = document.getElementById('lista-disciplinas');
            divLista.innerHTML = '';
            
            disciplinasUnicas.forEach(disc => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.textContent = disc;
                btn.onclick = () => selecionarDisciplina(disc);
                divLista.appendChild(btn);
            });
        }

        // Navegação de Telas
        function esconderTudo() {
            elDisciplinaScreen.style.display = 'none';
            elAssuntoScreen.style.display = 'none';
            elQuizScreen.style.display = 'none';
            elEndScreen.style.display = 'none';
        }

        function mostrarDisciplinas() {
            esconderTudo();
            elDisciplinaScreen.style.display = 'block';
        }

        function mostrarAssuntosDaDisciplinaAtual() {
            selecionarDisciplina(disciplinaAtual);
        }

        // Lógica de Seleção
        function selecionarDisciplina(disciplina) {
            disciplinaAtual = disciplina;
            document.getElementById('titulo-disciplina-escolhida').textContent = disciplina;
            
            const assuntosUnicos = [...new Set(bancoDeQuestoes.filter(q => q.disciplina === disciplina).map(q => q.assunto))];
            
            const divLista = document.getElementById('lista-assuntos');
            divLista.innerHTML = '';

            const btnTodos = document.createElement('button');
            btnTodos.className = 'menu-btn';
            btnTodos.style.backgroundColor = '#eff6ff';
            btnTodos.textContent = "Misturar Todos os Assuntos";
            btnTodos.onclick = () => iniciarQuiz('Todos');
            divLista.appendChild(btnTodos);
            
            assuntosUnicos.forEach(assunto => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.textContent = assunto;
                btn.onclick = () => iniciarQuiz(assunto);
                divLista.appendChild(btn);
            });

            esconderTudo();
            elAssuntoScreen.style.display = 'block';
        }

        function iniciarQuiz(assuntoEscolhido) {
            assuntoAtual = assuntoEscolhido;
            
            if (assuntoEscolhido === 'Todos') {
                questoesFiltradas = bancoDeQuestoes.filter(q => q.disciplina === disciplinaAtual);
                document.getElementById('subject').textContent = disciplinaAtual + " (Geral)";
            } else {
                questoesFiltradas = bancoDeQuestoes.filter(q => q.disciplina === disciplinaAtual && q.assunto === assuntoEscolhido);
                document.getElementById('subject').textContent = assuntoEscolhido;
            }

            questaoAtual = 0;
            pontuacao = 0;
            document.getElementById('score').textContent = 0;
            document.getElementById('total-questions').textContent = questoesFiltradas.length;

            esconderTudo();
            elQuizScreen.style.display = 'block';
            carregarQuestao();
        }

        // Lógica do Quiz
        function carregarQuestao() {
            const q = questoesFiltradas[questaoAtual];
            document.getElementById('question').textContent = q.enunciado;
            
            const elOptions = document.getElementById('options');
            elOptions.innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback-container').style.display = 'none';

            q.alternativas.forEach((texto, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="letter">${letras[index]})</span> ${texto}`;
                btn.onclick = () => verificarResposta(index, btn);
                elOptions.appendChild(btn);
            });
        }

        function verificarResposta(indiceSelecionado, botaoClicado) {
            const q = questoesFiltradas[questaoAtual];
            const botoes = document.querySelectorAll('.option-btn');
            const elFeedback = document.getElementById('feedback-container');

            botoes.forEach(btn => btn.disabled = true);

            if (indiceSelecionado === q.correta) {
                botaoClicado.classList.add('correct');
                pontuacao++;
                document.getElementById('score').textContent = pontuacao;
                elFeedback.style.backgroundColor = '#dcfce7'; 
                elFeedback.style.color = '#166534';
                elFeedback.innerHTML = `<strong>Acertou!</strong> ${q.explicacao}`;
            } else {
                botaoClicado.classList.add('wrong');
                botoes[q.correta].classList.add('correct'); 
                elFeedback.style.backgroundColor = '#fee2e2'; 
                elFeedback.style.color = '#991b1b';
                elFeedback.innerHTML = `<strong>Errou.</strong> A resposta correta era a alternativa ${letras[q.correta]}.<br><br>${q.explicacao}`;
            }

            elFeedback.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function proximaQuestao() {
            questaoAtual++;
            if (questaoAtual < questoesFiltradas.length) {
                carregarQuestao();
            } else {
                esconderTudo();
                elEndScreen.style.display = 'block';
                document.getElementById('final-score').textContent = pontuacao;
                document.getElementById('final-total').textContent = questoesFiltradas.length;
            }
        }

        // Inicia o app mapeando as disciplinas
        carregarDisciplinas();

    </script>
</body>
</html>
