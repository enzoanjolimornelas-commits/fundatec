<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Fundatec - Concursos</title>
    <style>
        :root {
            --primary: #1e3a8a;     
            --secondary: #3b82f6;   
            --success: #16a34a;     
            --error: #dc2626;       
            --bg: #f1f5f9;          
            --surface: #ffffff;     
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        #game-container {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
            max-height: 90vh;
            overflow-y: auto;
        }

        /* --- Telas do Sistema --- */
        #disciplina-screen, #assunto-screen, #quiz-screen, #end-screen, #admin-screen {
            display: none;
        }
        
        #disciplina-screen { display: block; }

        .screen-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .screen-header h2 { color: var(--primary); margin-bottom: 8px; }
        .screen-header p { color: var(--text-muted); }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            background-color: var(--surface);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        .btn-add {
            border-color: var(--success);
            color: var(--success);
        }
        .btn-add:hover {
            background-color: var(--success);
            color: white;
        }

        /* --- Formulário de Cadastro --- */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            border-color: var(--secondary);
        }

        /* --- Estilos do Quiz --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-voltar {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-voltar:hover { color: var(--primary); }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .subject-tag {
            background-color: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn span.letter {
            font-weight: bold;
            margin-right: 12px;
            color: var(--primary);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #eff6ff;
        }

        .option-btn.correct { background-color: var(--success); border-color: var(--success); color: white; }
        .option-btn.correct span.letter { color: white; }
        .option-btn.wrong { background-color: var(--error); border-color: var(--error); color: white; }
        .option-btn.wrong span.letter { color: white; }
        .option-btn:disabled { cursor: default; }

        #feedback-container {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .btn-primary {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover { background-color: #152c6b; }
        #next-btn { display: none; }

        #end-screen { text-align: center; }
        #end-screen h2 { margin-bottom: 16px; color: var(--primary); }
        #end-screen p { margin-bottom: 24px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Tela 1: Escolha de Disciplina / Menu Principal -->
        <div id="disciplina-screen">
            <div class="screen-header">
                <h2>Simulado Fundatec</h2>
                <p>Escolha a disciplina ou adicione novas questões:</p>
            </div>
            <div class="menu-options" id="lista-disciplinas">
                <!-- Gerado via JS -->
            </div>
            <div class="menu-options" style="margin-top: 12px;">
                <button class="menu-btn btn-add" onclick="mostrarTelaAdmin()">➕ Cadastrar Nova Questão</button>
            </div>
        </div>

        <!-- Tela de Cadastro de Questões (Admin) -->
        <div id="admin-screen">
            <div class="top-bar">
                <button class="btn-voltar" onclick="mostrarDisciplinas()">← Voltar ao Menu</button>
            </div>
            <div class="screen-header">
                <h2>Cadastrar Questão</h2>
                <p>Insira os dados da nova questão da Fundatec</p>
            </div>
            <form id="form-questao" onsubmit="salvarNovaQuestao(event)">
                <div class="form-group">
                    <label>Disciplina:</label>
                    <input type="text" id="adm-disciplina" placeholder="Ex: Direito, Língua Portuguesa, Informática" required>
                </div>
                <div class="form-group">
                    <label>Assunto (do Edital):</label>
                    <input type="text" id="adm-assunto" placeholder="Ex: Lei Maria da Penha, Crase, Excel" required>
                </div>
                <div class="form-group">
                    <label>Enunciado da Questão:</label>
                    <textarea id="adm-enunciado" rows="4" placeholder="Digite o texto da pergunta..." required></textarea>
                </div>
                <div class="form-group"><label>Alternativa A:</label><input type="text" id="adm-alt0" required></div>
                <div class="form-group"><label>Alternativa B:</label><input type="text" id="adm-alt1" required></div>
                <div class="form-group"><label>Alternativa C:</label><input type="text" id="adm-alt2" required></div>
                <div class="form-group"><label>Alternativa D:</label><input type="text" id="adm-alt3" required></div>
                <div class="form-group"><label>Alternativa E:</label><input type="text" id="adm-alt4" required></div>
                
                <div class="form-group">
                    <label>Alternativa Correta:</label>
                    <select id="adm-correta">
                        <option value="0">Alternativa A</option>
                        <option value="1">Alternativa B</option>
                        <option value="2">Alternativa C</option>
                        <option value="3">Alternativa D</option>
                        <option value="4">Alternativa E</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Explicação / Gabarito Comentado:</label>
                    <textarea id="adm-explicacao" rows="3" placeholder="Por que esta é a alternativa correta?"></textarea>
                </div>

                <button type="submit" class="btn-primary">Salvar Questão</button>
            </form>
        </div>

        <!-- Tela 2: Escolha de Assunto -->
        <div id="assunto-screen">
            <div class="top-bar">
                <button class="btn-voltar" onclick="mostrarDisciplinas()">← Voltar às Disciplinas</button>
            </div>
            <div class="screen-header">
                <h2 id="titulo-disciplina-escolhida">Disciplina</h2>
                <p>Escolha o tópico do edital:</p>
            </div>
            <div class="menu-options" id="lista-assuntos"></div>
        </div>

        <!-- Tela 3: Quiz -->
        <div id="quiz-screen">
            <div class="top-bar">
                <button class="btn-voltar" onclick="mostrarAssuntosDaDisciplinaAtual()">← Trocar Assunto</button>
            </div>
            <header>
                <div class="subject-tag" id="subject">Assunto</div>
                <div class="score-board">Acertos: <span id="score">0</span>/<span id="total-questions">0</span></div>
            </header>

            <div class="question-text" id="question">Carregando questão...</div>
            <div class="options-grid" id="options"></div>
            <div id="feedback-container"></div>
            
            <button id="next-btn" class="btn-primary" onclick="proximaQuestao()">Próxima Questão ➔</button>
        </div>

        <!-- Tela 4: Final -->
        <div id="end-screen">
            <h2>Fim das Questões!</h2>
            <p>Você acertou <strong id="final-score">0</strong> de <strong id="final-total">0</strong> questões deste tópico.</p>
            <button class="btn-primary" onclick="mostrarDisciplinas()">Voltar ao Menu Principal</button>
        </div>
    </div>

    <script>
        // Banco de Questões Base

        const bancoDeQuestoes = [
            // PORTUGUÊS
            {
                disciplina: "Língua Portuguesa",
                assunto: "Sintaxe: Tipos de Predicado",
                enunciado: "Na frase 'Os candidatos terminaram a prova exaustos', classifique o tipo de predicado:",
                alternativas: [
                    "Predicado Verbal",
                    "Predicado Nominal",
                    "Predicado Verbo-Nominal",
                    "Predicado Inexistente",
                    "Predicado Simples"
                ],
                correta: 2, 
                explicacao: "Correto! É um predicado verbo-nominal porque possui dois núcleos: um verbo de ação ('terminaram') e um predicativo do sujeito que indica estado ('exaustos')."
            },
            {
                disciplina: "Língua Portuguesa",
                assunto: "Sintaxe: Tipos de Predicado",
                enunciado: "(Fundatec) Assinale a alternativa que apresenta um predicado verbo-nominal.",
                alternativas: [
                    "Os candidatos chegaram atrasados.",
                    "A tempestade destruiu o telhado da escola.",
                    "A criança parecia doente após o almoço.",
                    "Os pássaros voavam velozmente pelo céu.",
                    "Nós precisamos de muita ajuda hoje."
                ],
                correta: 0,
                explicacao: "Correto! O predicado verbo-nominal possui dois núcleos: um verbo de ação ('chegaram') e um predicativo do sujeito indicando estado ('atrasados')."
            },
            {
                disciplina: "Língua Portuguesa",
                assunto: "Crase",
                enunciado: "(Fundatec) Assinale a alternativa que preenche corretamente a lacuna: 'O diretor referiu-se ___ nova funcionária com muito respeito.'",
                alternativas: ["a", "à", "as", "às", "para"],
                correta: 1,
                explicacao: "Correto! O verbo 'referir-se' exige a preposição 'a' e a palavra 'nova' admite o artigo 'a'. A junção forma a crase (à)."
            },
            {
                disciplina: "Língua Portuguesa",
                assunto: "Concordância Verbal",
                enunciado: "(Fundatec) Assinale a alternativa correta quanto à concordância verbal:",
                alternativas: [
                    "Fazem três anos que não o vejo.",
                    "Haviam muitas pessoas na sala de espera.",
                    "Alugam-se apartamentos nesta região.",
                    "Necessitam-se de funcionários com urgência.",
                    "Vão fazer cinco anos que me mudei de cidade."
                ],
                correta: 2,
                explicacao: "Correto! Na voz passiva sintética, o verbo concorda com o sujeito (apartamentos são alugados). Os verbos 'fazer' e 'haver' no sentido de tempo ou existir ficam no singular."
            },
            {
                disciplina: "Língua Portuguesa",
                assunto: "Verbos",
                enunciado: "(Fundatec) Analise a forma verbal destacada na frase: 'Se ele MANTIVER o ritmo de estudos, será aprovado.' O verbo está conjugado no:",
                alternativas: [
                    "Futuro do pretérito do indicativo.",
                    "Presente do subjuntivo.",
                    "Futuro do subjuntivo.",
                    "Pretérito imperfeito do subjuntivo.",
                    "Infinitivo pessoal."
                ],
                correta: 2,
                explicacao: "Correto! 'Mantiver' é o futuro do subjuntivo do verbo 'manter', indicando uma hipótese futura."
            },

            // RACIOCÍNIO LÓGICO
            {
                disciplina: "Raciocínio Lógico",
                assunto: "Equivalência Lógica",
                enunciado: "Qual é a proposição logicamente equivalente a: 'Se estudo muito, então sou aprovado no concurso'?",
                alternativas: [
                    "Se sou aprovado no concurso, então estudo muito.",
                    "Se não estudo muito, então não sou aprovado no concurso.",
                    "Estudo muito e sou aprovado no concurso.",
                    "Se não sou aprovado no concurso, então não estudo muito.",
                    "Não estudo muito ou não sou aprovado no concurso."
                ],
                correta: 3,
                explicacao: "Correto! Esta é a regra da Contrapositiva (Inverte e Nega). 'Se P então Q' é equivalente a 'Se não Q então não P'."
            },
            {
                disciplina: "Raciocínio Lógico",
                assunto: "Negação Lógica",
                enunciado: "(Fundatec) Considere a proposição lógica: 'Se o candidato estuda, então ele passa na prova'. A negação lógica dessa proposição é:",
                alternativas: [
                    "Se o candidato não estuda, então ele não passa na prova.",
                    "O candidato não estuda ou ele não passa na prova.",
                    "O candidato estuda e não passa na prova.",
                    "Se o candidato passa na prova, então ele estuda.",
                    "O candidato não estuda e passa na prova."
                ],
                correta: 2,
                explicacao: "Correto! Para negar uma condicional (Se P, então Q), usa-se a regra do 'Mané' (Mantém a primeira E Nega a segunda): O candidato estuda E não passa na prova."
            },
            {
                disciplina: "Raciocínio Lógico",
                assunto: "Diagramas Lógicos",
                enunciado: "(Fundatec) Se todo A é B, e nenhum B é C, é correto afirmar logicamente que:",
                alternativas: [
                    "Algum A é C.",
                    "Nenhum A é C.",
                    "Todo C é A.",
                    "Algum C é B.",
                    "Todo B é A."
                ],
                correta: 1,
                explicacao: "Correto! Se A está totalmente dentro de B, e B e C não se tocam, então é impossível que A toque em C."
            },
            {
                disciplina: "Raciocínio Lógico",
                assunto: "Tautologia",
                enunciado: "(Fundatec) Assinale a alternativa que apresenta uma tautologia:",
                alternativas: [
                    "Chove ou não chove.",
                    "Se chove, então faz frio.",
                    "Chove e faz frio.",
                    "Não chove e não faz frio.",
                    "Chove se, e somente se, faz frio."
                ],
                correta: 0,
                explicacao: "Correto! Tautologia é uma proposição sempre verdadeira. 'P ou não P' (Princípio do terceiro excluído) sempre resultará em Verdadeiro."
            },

            // DIREITO
            {
                disciplina: "Direito",
                assunto: "Direito Constitucional: Fundamentos",
                enunciado: "Conforme o Art. 1º da CF, assinale a alternativa que apresenta um dos FUNDAMENTOS da República Federativa do Brasil:",
                alternativas: [
                    "Construir uma sociedade livre, justa e solidária.",
                    "A dignidade da pessoa humana.",
                    "Erradicar a pobreza e a marginalização.",
                    "Garantir o desenvolvimento nacional.",
                    "A concessão de asilo político."
                ],
                correta: 1,
                explicacao: "Correto! A dignidade da pessoa humana é um fundamento (SO-CI-DI-VA-PLU). A, C e D são objetivos fundamentais."
            },
            {
                disciplina: "Direito",
                assunto: "Direito Administrativo: Princípios",
                enunciado: "(Fundatec) Na Administração Pública, o princípio que exige que o ato seja praticado visando sempre o interesse público, sem favoritismos, é a:",
                alternativas: [
                    "Legalidade.",
                    "Impessoalidade.",
                    "Moralidade.",
                    "Publicidade.",
                    "Eficiência."
                ],
                correta: 1,
                explicacao: "Correto! O princípio da Impessoalidade determina tratamento igualitário, sem discriminações."
            },
            {
                disciplina: "Direito",
                assunto: "Direito Administrativo: Atos Administrativos",
                enunciado: "(Fundatec) São atributos (ou características) do ato administrativo, EXCETO:",
                alternativas: [
                    "Presunção de legitimidade.",
                    "Imperatividade.",
                    "Autoexecutoriedade.",
                    "Tipicidade.",
                    "Legalidade estrita."
                ],
                correta: 4,
                explicacao: "Correto! A legalidade é um PRINCÍPIO, não um atributo. Os atributos formam o mnemônico PATI."
            },
    // --- LÍNGUA PORTUGUESA ---
    {
        disciplina: "Língua Portuguesa",
        assunto: "Acentuação Gráfica",
        enunciado: "(Fundatec) Assinale a alternativa em que todas as palavras são acentuadas obedecendo à mesma regra gramatical:",
        alternativas: [
            "lâmpada, vítima, pássaro.",
            "café, caju, ali.",
            "fácil, tórax, cipó.",
            "saúde, saída, história.",
            "vêm, têm, chapéu."
        ],
        correta: 0,
        explicacao: "Correto! Todas as palavras da alternativa são proparoxítonas, e a regra determina que toda palavra proparoxítona deve ser acentuada."
    },
    {
        disciplina: "Língua Portuguesa",
        assunto: "Pontuação",
        enunciado: "(Fundatec) Em relação ao uso da vírgula, assinale a alternativa inteiramente correta:",
        alternativas: [
            "O aluno, estudou muito para a prova de ontem.",
            "Os candidatos, que chegaram cedo, conseguiram bons lugares.",
            "A banca exigiu, dos candidatos muito esforço.",
            "Na tarde de ontem choveu, muito forte.",
            "Maria, comprou um carro novo, no mês passado."
        ],
        correta: 1,
        explicacao: "Correto! As vírgulas estão isolando corretamente a oração subordinada adjetiva explicativa ('que chegaram cedo'). Nas demais alternativas, há separação proibida de sujeito e predicado ou de verbo e complemento."
    },
    {
        disciplina: "Língua Portuguesa",
        assunto: "Morfologia: Funções do 'Que'",
        enunciado: "(Fundatec) Na frase 'O material QUE comprei é muito útil', a palavra destacada classifica-se morfologicamente como:",
        alternativas: [
            "Conjunção integrante.",
            "Pronome relativo.",
            "Partícula expletiva.",
            "Pronome interrogativo.",
            "Conjunção coordenativa explicativa."
        ],
        correta: 1,
        explicacao: "Correto! O 'que' pode ser substituído por 'o qual' (O material 'o qual' comprei), pois está retomando o substantivo anterior (material). Logo, exerce função de pronome relativo."
    },
    {
        disciplina: "Língua Portuguesa",
        assunto: "Colocação Pronominal",
        enunciado: "(Fundatec) Assinale a alternativa em que a colocação pronominal desrespeita a norma-padrão da Língua Portuguesa:",
        alternativas: [
            "Nunca me disseram a verdade.",
            "Alguém o ajudou com as malas.",
            "Entregar-te-ei o documento amanhã.",
            "Se me chamarem, eu irei.",
            "Me empresta a sua caneta preta?"
        ],
        correta: 4,
        explicacao: "Correto! É regra básica: segundo a norma culta, não se inicia frase com pronome oblíquo átono (Me, Te, Se, Nos, Vos...). O correto seria: 'Empresta-me a sua caneta preta?'."
    },

    // --- RACIOCÍNIO LÓGICO ---
    {
        disciplina: "Raciocínio Lógico",
        assunto: "Conjuntos",
        enunciado: "(Fundatec) Em uma sala com 40 concurseiros, 25 estudam Português e 20 estudam Raciocínio Lógico. Sabendo que todos estudam pelo menos uma dessas matérias, quantos alunos estudam AMBAS as matérias?",
        alternativas: [
            "5",
            "10",
            "15",
            "20",
            "25"
        ],
        correta: 0,
        explicacao: "Correto! O total real de alunos é 40. Somando os grupos temos: 25 + 20 = 45. A intersecção (quem faz os dois) é exatamente a diferença que ultrapassa o total: 45 - 40 = 5 alunos."
    },
    {
        disciplina: "Raciocínio Lógico",
        assunto: "Análise Combinatória",
        enunciado: "(Fundatec) De quantas maneiras diferentes podemos organizar 5 pessoas em uma fila indiana?",
        alternativas: [
            "25",
            "50",
            "120",
            "60",
            "100"
        ],
        correta: 2,
        explicacao: "Correto! Trata-se de uma permutação simples de 5 elementos (Calculada por 5 fatorial, ou 5!). Conta: 5 x 4 x 3 x 2 x 1 = 120."
    },
    {
        disciplina: "Raciocínio Lógico",
        assunto: "Sequências Lógicas",
        enunciado: "(Fundatec) Qual é o próximo número da sequência lógica: 2, 5, 10, 17, 26, ...?",
        alternativas: [
            "35",
            "37",
            "39",
            "32",
            "41"
        ],
        correta: 1,
        explicacao: "Correto! A diferença entre os números aumenta em números ímpares consecutivos: +3 (vira 5), +5 (vira 10), +7 (vira 17), +9 (vira 26). O próximo salto é +11, ou seja, 26 + 11 = 37."
    },

    // --- DIREITO ---
    {
        disciplina: "Direito",
        assunto: "Direito Constitucional: Art. 5º",
        enunciado: "(Fundatec) De acordo com o Art. 5º da Constituição Federal, é correto afirmar sobre o direito de associação:",
        alternativas: [
            "É plena a liberdade de associação para fins lícitos, inclusive as de caráter paramilitar.",

            "A concessão de aumento apenas aos servidores ativos é sempre válida, pois a paridade entre ativos e inativos foi integralmente extinta.",
            "Todo aumento concedido aos servidores ativos deve obrigatoriamente ser estendido aos aposentados e pensionistas.",
            "A extensão do reajuste aos aposentados dependerá da regra de aposentadoria sob a qual o servidor se aposentou, podendo haver ou não direito à paridade.",
            "A paridade entre ativos e inativos aplica-se apenas aos ocupantes de cargos em comissão."
        ],
        correta: 2,
        explicacao: "Correto! As Reformas da Previdência acabaram com a regra geral de paridade. Hoje, o direito de o aposentado receber o mesmo aumento do servidor da ativa depende de ele ter ingressado no serviço público antes das reformas e cumprido as regras de transição específicas."
    },
    {
        disciplina: "Direito",
        assunto: "Direito Administrativo: Lei de Improbidade",
        enunciado: "(Simulado PPRS) Considerando as disposições da Lei de Improbidade Administrativa, assinale a alternativa correta.",
        alternativas: [
            "O sucessor do sujeito que causar dano ao erário está sujeito à obrigação de repará-lo independentemente do valor da herança.",
            "A perda patrimonial decorrente da atividade econômica sempre acarretará improbidade administrativa.",
            "Na responsabilização da pessoa jurídica por ato de improbidade, não poderão ser considerados os efeitos sociais das sanções.",
            "A sanção de perda dos bens ou valores acrescidos ilicitamente ao patrimônio só poderá ser executada após o trânsito em julgado da sentença condenatória."
        ],
        correta: 3,
        explicacao: "Correto! Conforme o Art. 20 da LIA, a perda da função pública, a suspensão dos direitos políticos e a perda dos bens só se efetivam com o 'trânsito em julgado' (quando não cabem mais recursos). A alternativa A está errada porque o herdeiro só responde até o limite do valor da herança."
    },

    // --- DIREITO PENAL ---
    {
        disciplina: "Direito",
        assunto: "Direito Penal: Abandono de Função",
        enunciado: "(Simulado PPRS) Lucas, servidor público federal que atua em faixa de fronteira, abandonou seu cargo público fora dos casos previstos em lei, resultando em prejuízo público. Nos termos do Código Penal, a conduta de Lucas configura:",
        alternativas: [
            "Crime contra a Administração Pública.",
            "Infração contra a função administrativa.",
            "Omissão.",
            "Reincidência.",
            "Contravenção penal."
        ],
        correta: 0,
        explicacao: "Correto! O abandono de função (Art. 323 do CP) é classificado penalmente como um Crime (e não mera infração ou contravenção). O fato de ocorrer na faixa de fronteira e causar prejuízo atua como qualificadora (aumenta a pena da prisão)."
    },
    {
        disciplina: "Direito",
        assunto: "Direito Penal: Exercício Funcional Antecipado",
        enunciado: "(Simulado PPRS) Álvaro, aprovado em concurso público e ansioso para trabalhar, inicia o exercício da função pública sem o prévio atendimento às exigências legais, sob permissão do seu diretor, Alberto. Quanto às condutas, é correto afirmar que:",
        alternativas: [
            "Por não ser ainda funcionário público, Álvaro não cometeu crime.",
            "Álvaro cometeu violação de sigilo funcional.",
            "Considerando a situação descrita, apenas Alberto cometeu crime.",
            "A conduta de Álvaro configura exercício funcional ilegalmente antecipado.",
            "Não há que se falar em punição penal para ambos."
        ],
        correta: 3,
        explicacao: "Correto! O Art. 324 do Código Penal criminaliza exatamente essa conduta: 'Entrar no exercício de função pública antes de satisfeitas as exigências legais, ou continuar a exercê-la, sem autorização'. Álvaro responderá por esse crime."
    }
        ];

        // Carrega questões salvas no navegador (LocalStorage) e junta com as base
        let bancoDeQuestoes = [...bancoDeQuestoesBase];
        const salvas = localStorage.getItem('bancoDeQuestoes_custom');
        if (salvas) {
            bancoDeQuestoes.push(...JSON.parse(salvas));
        }

        let disciplinaAtual = '';
        let assuntoAtual = '';
        let questoesFiltradas = [];
        let questaoAtual = 0;
        let pontuacao = 0;
        const letras = ['A', 'B', 'C', 'D', 'E'];

        const elDisciplinaScreen = document.getElementById('disciplina-screen');
        const elAssuntoScreen = document.getElementById('assunto-screen');
        const elQuizScreen = document.getElementById('quiz-screen');
        const elEndScreen = document.getElementById('end-screen');
        const elAdminScreen = document.getElementById('admin-screen');

        function carregarDisciplinas() {
            const disciplinasUnicas = [...new Set(bancoDeQuestoes.map(q => q.disciplina))];
            const divLista = document.getElementById('lista-disciplinas');
            divLista.innerHTML = '';
            
            disciplinasUnicas.forEach(disc => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.textContent = disc;
                btn.onclick = () => selecionarDisciplina(disc);
                divLista.appendChild(btn);
            });
        }

        function esconderTudo() {
            elDisciplinaScreen.style.display = 'none';
            elAssuntoScreen.style.display = 'none';
            elQuizScreen.style.display = 'none';
            elEndScreen.style.display = 'none';
            elAdminScreen.style.display = 'none';
        }

        function mostrarDisciplinas() {
            esconderTudo();
            elDisciplinaScreen.style.display = 'block';
            carregarDisciplinas();
        }

        function mostrarTelaAdmin() {
            esconderTudo();
            elAdminScreen.style.display = 'block';
        }

        function salvarNovaQuestao(event) {
            event.preventDefault();
            const novaQ = {
                disciplina: document.getElementById('adm-disciplina').value.trim(),
                assunto: document.getElementById('adm-assunto').value.trim(),
                enunciado: document.getElementById('adm-enunciado').value.trim(),
                alternativas: [
                    document.getElementById('adm-alt0').value.trim(),
                    document.getElementById('adm-alt1').value.trim(),
                    document.getElementById('adm-alt2').value.trim(),
                    document.getElementById('adm-alt3').value.trim(),
                    document.getElementById('adm-alt4').value.trim()
                ],
                correta: parseInt(document.getElementById('adm-correta').value),
                explicacao: document.getElementById('adm-explicacao').value.trim()
            };

            // Adiciona ao array global
            bancoDeQuestoes.push(novaQ);

            // Salva separadamente no LocalStorage
            let custom = JSON.parse(localStorage.getItem('bancoDeQuestoes_custom') || '[]');
            custom.push(novaQ);
            localStorage.setItem('bancoDeQuestoes_custom', JSON.stringify(custom));

            alert('Questão cadastrada com sucesso!');
            document.getElementById('form-questao').reset();
            mostrarDisciplinas();
        }

        function mostrarAssuntosDaDisciplinaAtual() {
            selecionarDisciplina(disciplinaAtual);
        }

        function selecionarDisciplina(disciplina) {
            disciplinaAtual = disciplina;
            document.getElementById('titulo-disciplina-escolhida').textContent = disciplina;
            
            const assuntosUnicos = [...new Set(bancoDeQuestoes.filter(q => q.disciplina === disciplina).map(q => q.assunto))];
            
            const divLista = document.getElementById('lista-assuntos');
            divLista.innerHTML = '';

            const btnTodos = document.createElement('button');
            btnTodos.className = 'menu-btn';
            btnTodos.style.backgroundColor = '#eff6ff';
            btnTodos.textContent = "Misturar Todos os Assuntos";
            btnTodos.onclick = () => iniciarQuiz('Todos');
            divLista.appendChild(btnTodos);
            
            assuntosUnicos.forEach(assunto => {
                const btn = document.createElement('button');
                btn.className = 'menu-btn';
                btn.textContent = assunto;
                btn.onclick = () => iniciarQuiz(assunto);
                divLista.appendChild(btn);
            });

            esconderTudo();
            elAssuntoScreen.style.display = 'block';
        }

        function iniciarQuiz(assuntoEscolhido) {
            assuntoAtual = assuntoEscolhido;
            
            if (assuntoEscolhido === 'Todos') {
                questoesFiltradas = bancoDeQuestoes.filter(q => q.disciplina === disciplinaAtual);
                document.getElementById('subject').textContent = disciplinaAtual + " (Geral)";
            } else {
                questoesFiltradas = bancoDeQuestoes.filter(q => q.disciplina === disciplinaAtual && q.assunto === assuntoEscolhido);
                document.getElementById('subject').textContent = assuntoEscolhido;
            }

            if (questoesFiltradas.length === 0) {
                alert("Não há questões para este assunto!");
                return;
            }

            questaoAtual = 0;
            pontuacao = 0;
            document.getElementById('score').textContent = 0;
            document.getElementById('total-questions').textContent = questoesFiltradas.length;

            esconderTudo();
            elQuizScreen.style.display = 'block';
            carregarQuestao();
        }

        function carregarQuestao() {
            const q = questoesFiltradas[questaoAtual];
            document.getElementById('question').textContent = q.enunciado;
            
            const elOptions = document.getElementById('options');
            elOptions.innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('feedback-container').style.display = 'none';

            q.alternativas.forEach((texto, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="letter">${letras[index]})</span> ${texto}`;
                btn.onclick = () => verificarResposta(index, btn);
                elOptions.appendChild(btn);
            });
        }

        function verificarResposta(indiceSelecionado, botaoClicado) {
            const q = questoesFiltradas[questaoAtual];
            const botoes = document.querySelectorAll('.option-btn');
            const elFeedback = document.getElementById('feedback-container');

            botoes.forEach(btn => btn.disabled = true);

            if (indiceSelecionado === q.correta) {
                botaoClicado.classList.add('correct');
                pontuacao++;
                document.getElementById('score').textContent = pontuacao;
                elFeedback.style.backgroundColor = '#dcfce7'; 
                elFeedback.style.color = '#166534';
                elFeedback.innerHTML = `<strong>Acertou!</strong> ${q.explicacao}`;
            } else {
                botaoClicado.classList.add('wrong');
                botoes[q.correta].classList.add('correct'); 
                elFeedback.style.backgroundColor = '#fee2e2'; 
                elFeedback.style.color = '#991b1b';
                elFeedback.innerHTML = `<strong>Errou.</strong> A resposta correta era a alternativa ${letras[q.correta]}.<br><br>${q.explicacao}`;
            }

            elFeedback.style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function proximaQuestao() {
            questaoAtual++;
            if (questaoAtual < questoesFiltradas.length) {
                carregarQuestao();
            } else {
                esconderTudo();
                elEndScreen.style.display = 'block';
                document.getElementById('final-score').textContent = pontuacao;
                document.getElementById('final-total').textContent = questoesFiltradas.length;
            }
        }

        // Inicialização
        carregarDisciplinas();
    </script>
</body>
</html>
