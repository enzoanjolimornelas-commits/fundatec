<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Fundatec - Concursos</title>
    <style>
        :root {
            --primary: #1e3a8a;     
            --secondary: #3b82f6;   
            --success: #16a34a;     
            --error: #dc2626;       
            --bg: #f1f5f9;          
            --surface: #ffffff;     
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        #game-container {
            background: var(--surface);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 24px;
        }

        /* --- Estilos do Menu --- */
        #menu-screen {
            text-align: center;
        }

        #menu-screen h2 {
            color: var(--primary);
            margin-bottom: 8px;
        }

        #menu-screen p {
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-btn {
            background-color: var(--surface);
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background-color: var(--primary);
            color: white;
        }

        /* --- Estilos do Quiz --- */
        #quiz-screen {
            display: none; /* Oculto no início */
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-voltar {
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .btn-voltar:hover { color: var(--primary); }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e2e8f0;
        }

        .score-board {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
        }

        .subject-tag {
            background-color: var(--primary);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 1.15rem;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: var(--surface);
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn span.letter {
            font-weight: bold;
            margin-right: 12px;
            color: var(--primary);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--secondary);
            background: #eff6ff;
        }

        .option-btn.correct { background-color: var(--success); border-color: var(--success); color: white; }
        .option-btn.correct span.letter { color: white; }
        .option-btn.wrong { background-color: var(--error); border-color: var(--error); color: white; }
        .option-btn.wrong span.letter { color: white; }
        .option-btn:disabled { cursor: default; }

        #feedback-container {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            line-height: 1.5;
            display: none;
        }

        .btn-primary {
            margin-top: 20px;
            width: 100%;
            padding: 16px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover { background-color: #152c6b; }
        #next-btn { display: none; }

        /* --- Tela Final --- */
        #end-screen {
            text-align: center;
            display: none;
        }
        #end-screen h2 { margin-bottom: 16px; color: var(--primary); }
        #end-screen p { margin-bottom: 24px; font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="game-container">
        
        <!-- Tela de Menu Inicial -->
        <div id="menu-screen">
            <h2>Simulado Fundatec</h2>
            <p>Escolha o que você quer estudar hoje:</p>
            <div class="menu-options">
                <button class="menu-btn" onclick="iniciarJogo('Língua Portuguesa')">Língua Portuguesa</button>
                <button class="menu-btn" onclick="iniciarJogo('Raciocínio Lógico')">Raciocínio Lógico</button>
                <button class="menu-btn" onclick="iniciarJogo('Direito')">Direitos (Const. e Adm.)</button>
                <button class="menu-btn" onclick="iniciarJogo('Todas')">Misturar Todas as Matérias</button>
            </div>
        </div>

        <!-- Tela do Quiz -->
        <div id="quiz-screen">
            <div class="top-bar">
                <button class="btn-voltar" onclick="voltarAoMenu()">← Trocar Matéria</button>
            </div>
            <header>
                <div class="subject-tag" id="subject">Matéria</div>
                <div class="score-board">Acertos: <span id="score">0</span>/<span id="total-questions">0</span></div>
            </header>

            <div class="question-text" id="question">Carregando questão...</div>
            <div class="options-grid" id="options"></div>
            <div id="feedback-container"></div>
            
            <button id="next-btn" class="btn-primary" onclick="proximaQuestao()">Próxima Questão ➔</button>
        </div>

        <!-- Tela Final -->
        <div id="end-screen">
            <h2>Simulado Concluído!</h2>
            <p>Você acertou <strong id="final-score">0</strong> de <strong id="final-total">0</strong> questões.</p>
            <button class="btn-primary" onclick="voltarAoMenu()">Voltar ao Menu Inicial</button>
        </div>
    </div>

    <script>
        // Banco de Questões Completo
        const bancoDeQuestoes = [
            {
                disciplina: "Língua Portuguesa",
                enunciado: "Na frase 'Os candidatos terminaram a prova exaustos', classifique o tipo de predicado:",
                alternativas: [
                    "Predicado Verbal",
                    "Predicado Nominal",
                    "Predicado Verbo-Nominal",
                    "Predicado Inexistente",
                    "Predicado Simples"
                ],
                correta: 2, 
                explicacao: "Correto! É um predicado verbo-nominal porque possui dois núcleos: um verbo de ação ('terminaram') e um predicativo do sujeito que indica estado ('exaustos')."
            },
            {
                disciplina: "Raciocínio Lógico",
                enunciado: "Qual é a proposição logicamente equivalente a: 'Se estudo muito, então sou aprovado no concurso'?",
                alternativas: [
                    "Se sou aprovado no concurso, então estudo muito.",
                    "Se não estudo muito, então não sou aprovado no concurso.",
                    "Estudo muito e sou aprovado no concurso.",
                    "Se não sou aprovado no concurso, então não estudo muito.",
                    "Não estudo muito ou não sou aprovado no concurso."
                ],
                correta: 3,
                explicacao: "Correto! Esta é a regra da Contrapositiva (Inverte e Nega). 'Se P então Q' é equivalente a 'Se não Q então não P'."
            },
            {
                disciplina: "Direito Constitucional",
                enunciado: "Conforme o Art. 1º da Constituição Federal, assinale a alternativa que apresenta um dos FUNDAMENTOS da República Federativa do Brasil:",
                alternativas: [
                    "Construir uma sociedade livre, justa e solidária.",
                    "A dignidade da pessoa humana.",
                    "Erradicar a pobreza e a marginalização.",
                    "Garantir o desenvolvimento nacional.",
                    "A concessão de asilo político."
                ],
                correta: 1,
                explicacao: "Correto! A dignidade da pessoa humana é um fundamento (mneumônico SO-CI-DI-VA-PLU). As alternativas A, C e D são objetivos fundamentais (Art. 3º), e a E é princípio nas relações internacionais (Art. 4º)."
            },
            {
                disciplina: "Língua Portuguesa",
                enunciado: "Assinale a alternativa em que o verbo em destaque é transitivo direto e indireto (bitransitivo):",
                alternativas: [
                    "A chuva CAIU pesada durante a noite.",
                    "Os alunos PRECISAM de mais tempo.",
                    "O diretor ENTREGOU o prêmio ao vencedor.",
                    "O sol BRILHA para todos.",
                    "A cidade PARECE tranquila hoje."
                ],
                correta: 2,
                explicacao: "Correto! 'Entregou' exige dois complementos: O quê? (o prêmio - objeto direto) A quem? (ao vencedor - objeto indireto)."
            },
            {
                disciplina: "Língua Portuguesa",
                enunciado: "(Fundatec) Assinale a alternativa que apresenta um predicado verbo-nominal.",
                alternativas: [
                    "Os candidatos chegaram atrasados.",
                    "A tempestade destruiu o telhado da escola.",
                    "A criança parecia doente após o almoço.",
                    "Os pássaros voavam velozmente pelo céu.",
                    "Nós precisamos de muita ajuda hoje."
                ],
                correta: 0,
                explicacao: "Correto! O predicado verbo-nominal possui dois núcleos: um verbo de ação ('chegaram') e um predicativo do sujeito indicando estado ('atrasados')."
            },
            {
                disciplina: "Língua Portuguesa",
                enunciado: "(Fundatec) Analise a forma verbal destacada na frase: 'Se ele MANTIVER o ritmo de estudos, será aprovado.' O verbo está conjugado no:",
                alternativas: [
                    "Futuro do pretérito do indicativo.",
                    "Presente do subjuntivo.",
                    "Futuro do subjuntivo.",
                    "Pretérito imperfeito do subjuntivo.",
                    "Infinitivo pessoal."
                ],
                correta: 2,
                explicacao: "Correto! 'Mantiver' é o futuro do subjuntivo do verbo 'manter', indicando uma hipótese ou condição futura."
            },
            {
                disciplina: "Raciocínio Lógico",
                enunciado: "(Fundatec) Considere a proposição lógica: 'Se o candidato estuda, então ele passa na prova'. A negação lógica dessa proposição é:",
                alternativas: [
                    "Se o candidato não estuda, então ele não passa na prova.",
                    "O candidato não estuda ou ele não passa na prova.",
                    "O candidato estuda e não passa na prova.",
                    "Se o candidato passa na prova, então ele estuda.",
                    "O candidato não estuda e passa na prova."
                ],
                correta: 2,
                explicacao: "Correto! Para negar uma condicional (Se P, então Q), usa-se a regra do 'Mané' (Mantém a primeira E Nega a segunda): O candidato estuda E não passa na prova."
            },
            {
                disciplina: "Direito Constitucional",
                enunciado: "(Fundatec) Nos expressos termos do Art. 2º da Constituição Federal de 1988, são Poderes da União, independentes e harmônicos entre si:",
                alternativas: [
                    "O Executivo, o Legislativo e o Ministério Público.",
                    "O Legislativo, o Executivo e o Judiciário.",
                    "O Executivo, o Judiciário e o Tribunal de Contas da União.",
                    "O Legislativo, o Judiciário e as Forças Armadas.",
                    "O Ministério Público, a Defensoria Pública e o Judiciário."
                ],
                correta: 1,
                explicacao: "Correto! Trata-se da literalidade do Artigo 2º da CF/88, consagrando o princípio da separação dos poderes (Legislativo, Executivo e Judiciário)."
            },
            {
                disciplina: "Direito Administrativo",
                enunciado: "(Fundatec) Na Administração Pública, o princípio que exige que o ato administrativo seja praticado visando sempre o interesse público, não podendo o administrador agir com favoritismos ou perseguições, é o princípio da:",
                alternativas: [
                    "Legalidade.",
                    "Impessoalidade.",
                    "Moralidade.",
                    "Publicidade.",
                    "Eficiência."
                ],
                correta: 1,
                explicacao: "Correto! O princípio da Impessoalidade (presente no LIMPE do art. 37 da CF) determina que a Administração deve tratar todos de forma igual, sem discriminações, buscando estritamente a finalidade pública."
            },
            {
                disciplina: "Raciocínio Lógico",
                enunciado: "(Fundatec) Assinale a alternativa que apresenta uma tautologia:",
                alternativas: [
                    "Chove ou não chove.",
                    "Se chove, então faz frio.",
                    "Chove e faz frio.",
                    "Não chove e não faz frio.",
                    "Chove se, e somente se, faz frio."
                ],
                correta: 0,
                explicacao: "Correto! Uma tautologia é uma proposição que é sempre verdadeira. 'P ou não P' (Princípio do terceiro excluído) sempre resultará em Verdadeiro."
            }
        ];

        // Novas Variáveis de Estado
        let questoesFiltradas = [];
        let questaoAtual = 0;
        let pontuacao = 0;
        const letras = ['A', 'B', 'C', 'D', 'E'];

        // Elementos do DOM
        const elMenuScreen = document.getElementById('menu-screen');
        const elQuizScreen = document.getElementById('quiz-screen');
        const elEndScreen = document.getElementById('end-screen');
        const elSubject = document.getElementById('subject');
        const elScore = document.getElementById('score');
        const elTotal = document.getElementById('total-questions');
        const elQuestion = document.getElementById('question');
        const elOptions = document.getElementById('options');
        const elNextBtn = document.getElementById('next-btn');
        const elFeedback = document.getElementById('feedback-container');

        // Volta para a tela inicial
        function voltarAoMenu() {
            elQuizScreen.style.display = 'none';
            elEndScreen.style.display = 'none';
            elMenuScreen.style.display = 'block';
        }

        // Inicia o jogo com a disciplina filtrada
        function iniciarJogo(disciplinaEscolhida) {
            if (disciplinaEscolhida === 'Todas') {
                questoesFiltradas = [...bancoDeQuestoes];
            } else if (disciplinaEscolhida === 'Direito') {
                // Filtra qualquer disciplina que tenha "Direito" no nome
                questoesFiltradas = bancoDeQuestoes.filter(q => q.disciplina.includes('Direito'));
            } else {
                questoesFiltradas = bancoDeQuestoes.filter(q => q.disciplina === disciplinaEscolhida);
            }

            // Se por acaso a matéria não tiver questões
            if (questoesFiltradas.length === 0) {
                alert("Ainda não há questões cadastradas para esta matéria!");
                return;
            }

            questaoAtual = 0;
            pontuacao = 0;
            elScore.textContent = 0;
            elTotal.textContent = questoesFiltradas.length;

            elMenuScreen.style.display = 'none';
            elEndScreen.style.display = 'none';
            elQuizScreen.style.display = 'block';

            carregarQuestao();
        }

        // Carrega a questão filtrada
        function carregarQuestao() {
            const q = questoesFiltradas[questaoAtual];
            
            elSubject.textContent = q.disciplina;
            elQuestion.textContent = q.enunciado;
            
            elOptions.innerHTML = '';
            elNextBtn.style.display = 'none';
            elFeedback.style.display = 'none';

            q.alternativas.forEach((texto, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="letter">${letras[index]})</span> ${texto}`;
                btn.onclick = () => verificarResposta(index, btn);
                elOptions.appendChild(btn);
            });
        }

        function verificarResposta(indiceSelecionado, botaoClicado) {
            const q = questoesFiltradas[questaoAtual];
            const botoes = document.querySelectorAll('.option-btn');

            botoes.forEach(btn => btn.disabled = true);

            if (indiceSelecionado === q.correta) {
                botaoClicado.classList.add('correct');
                pontuacao++;
                elScore.textContent = pontuacao;
                elFeedback.style.backgroundColor = '#dcfce7'; 
                elFeedback.style.color = '#166534';
                elFeedback.innerHTML = `<strong>Acertou!</strong> ${q.explicacao}`;
            } else {
                botaoClicado.classList.add('wrong');
                botoes[q.correta].classList.add('correct'); 
                elFeedback.style.backgroundColor = '#fee2e2'; 
                elFeedback.style.color = '#991b1b';
                elFeedback.innerHTML = `<strong>Errou.</strong> A resposta correta era a alternativa ${letras[q.correta]}.<br><br>${q.explicacao}`;
            }

            elFeedback.style.display = 'block';
            elNextBtn.style.display = 'block';
        }

        function proximaQuestao() {
            questaoAtual++;
            if (questaoAtual < questoesFiltradas.length) {
                carregarQuestao();
            } else {
                finalizarJogo();
            }
        }

        function finalizarJogo() {
            elQuizScreen.style.display = 'none';
            elEndScreen.style.display = 'block';
            document.getElementById('final-score').textContent = pontuacao;
            document.getElementById('final-total').textContent = questoesFiltradas.length;
        }

    </script>
</body>
</html>
